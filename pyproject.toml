[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-agent"
version = "0.1.0"
description = "Terminal coding agent with bounded context and durable tree sessions"
requires-python = ">=3.11,<3.12"
dependencies = [
  "hello-agents @ git+https://github.com/jjyaoao/HelloAgents.git@93e77ea60c13436636c9b39b6761ff8dfe940ba2",
  "pydantic>=2.10,<3", "tiktoken>=0.8", "typer>=0.15,<1", "rich>=13,<15",
  "python-dotenv>=1,<2", "filelock>=3.16,<4",
  "regex>=2024.11",
]

[project.scripts]
devflow = "devflow.cli:app"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.11", "build>=1"]

[tool.setuptools.packages.find]
include = ["devflow*"]

[tool.setuptools.package-data]
devflow = ["skills/builtin/*/SKILL.md", "benchmarks/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
