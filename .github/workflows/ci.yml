name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv sync --frozen
      - run: uv run ruff check devflow tests scripts
      - run: uv run ruff format --check devflow tests scripts
      - run: uv run pytest --cov=devflow --cov-report=term-missing
      - run: uv run devflow bench tool
      - run: uv run python -m build --wheel
